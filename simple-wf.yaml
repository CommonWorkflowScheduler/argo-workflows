apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: hello-world-
  labels:
    workflows.argoproj.io/archive-strategy: "false"
  annotations:
    workflows.argoproj.io/description: |
      This is a simple hello world example.
spec:
  entrypoint: diamond
  templates:
   - name: echo
     inputs:
       parameters:
       - name: message
       - name: index
     container:
       image: alpine:3.7
       command: [echo, "{{inputs.parameters.message}}{{inputs.parameters.index}}"]
     podSpecPatch: '{"containers":[{"name":"main", "resources":{"limits":{"cpu": "2", "memory": "8G"}, "requests": {"cpu": "2", "memory": "8G"}}}]}'
   - name: diamond
     dag:
       tasks:
       - name: A
         template: echo
         arguments:
           parameters:
           - {name: message, value: A}
           - {name: index, value: "{{item}}"}
         withSequence:
           count: 50

